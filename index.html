<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Adventure: Sistem Persamaan Linear (TERPADU JSIT)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        },
                        emeraldCustom: '#10b981',
                        gold: '#fbbf24'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s ease;
        }
        .glass-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(14, 165, 233, 0.3); }
            50% { box-shadow: 0 0 25px rgba(14, 165, 233, 0.6); }
        }
        .glow-active {
            animation: pulse-glow 2s infinite;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans overflow-x-hidden select-none bg-slate-950 text-slate-100">

    <!-- TOP NAVBAR -->
    <header id="main-header" class="hidden sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-400 flex items-center justify-center font-bold text-xl shadow-lg text-white">
                    <i class="fa-solid fa-square-root-variable"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base md:text-lg text-slate-100 leading-tight">Math Adventure</h1>
                    <p class="text-xs text-brand-400 font-medium">SPLDV — JSIT TERPADU</p>
                </div>
            </div>

            <!-- User Stats Summary Bar -->
            <div class="flex items-center space-x-3 md:space-x-6">
                <!-- XP Badge -->
                <div class="flex items-center space-x-2 bg-slate-800/80 border border-slate-700/80 px-3 py-1.5 rounded-full">
                    <i class="fa-solid fa-star text-gold text-sm animate-bounce"></i>
                    <span id="user-xp-display" class="font-bold text-sm text-gold">0 XP</span>
                </div>

                <!-- Level Badge -->
                <div class="hidden sm:flex items-center space-x-2 bg-brand-900/40 border border-brand-500/30 px-3 py-1.5 rounded-full">
                    <i class="fa-solid fa-shield-halved text-brand-400 text-sm"></i>
                    <span id="user-level-display" class="font-semibold text-xs text-brand-300">Lvl 1 - Math Explorer</span>
                </div>

                <!-- User Profile Trigger -->
                <div class="flex items-center space-x-2 pl-2 border-l border-slate-800">
                    <div class="w-8 h-8 rounded-full bg-slate-700 border border-brand-400 flex items-center justify-center text-xs font-bold text-brand-300" id="user-avatar-initial">
                        S
                    </div>
                    <div class="hidden md:block text-left">
                        <div id="user-name-display" class="text-xs font-semibold text-slate-200">Siswa</div>
                        <div id="user-class-display" class="text-[10px] text-slate-400">Kelas X</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT VIEWPORT -->
    <div class="flex-1 flex overflow-hidden relative">
        <!-- Desktop Sidebar Navigation -->
        <aside id="desktop-sidebar" class="hidden lg:flex flex-col w-64 bg-slate-900 border-r border-slate-800 p-4 space-y-6 overflow-y-auto custom-scrollbar">
            <div>
                <p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3 px-2">Menu Utama</p>
                <nav class="space-y-1" id="desktop-nav-links">
                    <!-- Nav items injected dynamically -->
                </nav>
            </div>

            <div class="pt-4 border-t border-slate-800">
                <p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3 px-2">Progress Belajar</p>
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400">Total Selesai</span>
                        <span id="sidebar-progress-percent" class="font-bold text-brand-400">0%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div id="sidebar-progress-bar" class="bg-gradient-to-r from-brand-500 to-cyan-400 h-full w-0 transition-all duration-500"></div>
                    </div>
                </div>
            </div>

            <!-- Recent Badges Widget -->
            <div class="pt-2">
                <p class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2 px-2">Pencapaian Terbaru</p>
                <div id="sidebar-badges-container" class="flex flex-wrap gap-2 px-1">
                    <span class="text-xs text-slate-500 italic">Belum ada badge</span>
                </div>
            </div>
        </aside>

        <!-- Dynamic Main Display Screen -->
        <main id="main-screen-container" class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 custom-scrollbar bg-slate-950">
            <!-- Screen content loaded dynamically via JavaScript -->
        </main>
    </div>

    <!-- MOBILE BOTTOM NAVIGATION BAR -->
    <nav id="mobile-nav" class="hidden lg:hidden sticky bottom-0 z-40 bg-slate-900/95 border-t border-slate-800 px-2 py-2 flex justify-around items-center">
        <!-- Buttons added by JavaScript -->
    </nav>

    <!-- GLOBAL MODAL / DIALOG -->
    <div id="app-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative space-y-4">
            <button id="modal-close-btn" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="modal-icon-container" class="w-12 h-12 rounded-full bg-brand-500/20 text-brand-400 flex items-center justify-center text-2xl">
                <i class="fa-solid fa-circle-info"></i>
            </div>
            <h3 id="modal-title" class="text-xl font-bold text-slate-100">Judul Modal</h3>
            <div id="modal-body" class="text-sm text-slate-300 leading-relaxed max-h-[60vh] overflow-y-auto custom-scrollbar">
                Konten modal di sini.
            </div>
            <div id="modal-footer" class="flex justify-end space-x-2 pt-2 border-t border-slate-800">
                <button id="modal-action-btn" class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 font-semibold text-sm text-white transition">
                    Mengerti
                </button>
            </div>
        </div>
    </div>

    <script>
        // APP STATE MANAGEMENT
        const APP_STATE = {
            user: {
                id: null,
                name: '',
                class: '',
                totalXP: 0,
                level: 1,
                levelTitle: 'Math Explorer',
                badges: [],
                scores: {
                    concept: 0,
                    process: 0,
                    reasoning: 0,
                    accuracy: 0,
                    application: 0
                },
                errorHistory: [],
                completedZones: {
                    telaah: false,
                    eksplorasi: false,
                    rumuskan: false,
                    presentasikan: false,
                    aplikasikan: false,
                    duniawi: false,
                    ukhrowi: false,
                    finalMission: false
                }
            },
            currentZone: 'welcome'
        };

        // JSIT TERPADU ZONES DEFINITION
        const ZONES = [
            { id: 'dashboard', name: 'Dashboard', icon: 'fa-house', color: 'text-sky-400' },
            { id: 'telaah', name: 'T — Telaah', icon: 'fa-magnifying-glass', color: 'text-amber-400', xp: 20 },
            { id: 'eksplorasi', name: 'E — Eksplorasi', icon: 'fa-flask', color: 'text-emerald-400', xp: 30 },
            { id: 'rumuskan', name: 'R — Rumuskan', icon: 'fa-brain', color: 'text-purple-400', xp: 50 },
            { id: 'presentasikan', name: 'P — Presentasikan', icon: 'fa-microphone', color: 'text-cyan-400', xp: 40 },
            { id: 'aplikasikan', name: 'A — Aplikasikan', icon: 'fa-rocket', color: 'text-indigo-400', xp: 60 },
            { id: 'duniawi', name: 'D — Duniawi', icon: 'fa-earth-americas', color: 'text-teal-400', xp: 50 },
            { id: 'ukhrowi', name: 'U — Ukhrowi', icon: 'fa-hands-praying', color: 'text-rose-400', xp: 30 },
            { id: 'finalMission', name: 'Final Mission', icon: 'fa-trophy', color: 'text-gold', xp: 100 },
            { id: 'report', name: 'Laporan Belajar', icon: 'fa-chart-pie', color: 'text-slate-300' }
        ];

        // BADGES CATALOG
        const BADGES_CATALOG = {
            'detektif': { name: 'Detektif Persamaan', icon: 'fa-magnifying-glass-chart', color: 'from-amber-500 to-orange-500' },
            'master_eliminasi': { name: 'Master Eliminasi', icon: 'fa-wand-magic-sparkles', color: 'from-emerald-500 to-teal-500' },
            'ahli_grafik': { name: 'Ahli Grafik', icon: 'fa-chart-line', color: 'from-blue-500 to-cyan-500' },
            'pemecah_masalah': { name: 'Pemecah Masalah', icon: 'fa-lightbulb', color: 'from-purple-500 to-indigo-500' },
            'math_explorer': { name: 'Math Explorer', icon: 'fa-compass', color: 'from-pink-500 to-rose-500' },
            'duniawi_solver': { name: 'Matematika dalam Kehidupan', icon: 'fa-globe', color: 'from-teal-500 to-emerald-500' },
            'ilmu_bermanfaat': { name: 'Ilmu yang Bermanfaat', icon: 'fa-hands-holding-heart', color: 'from-rose-500 to-red-500' }
        };

        // Simple Web Audio API Synthesizer for gamification sounds
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playTone(freq, duration, type = 'sine') {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            },
            success() {
                this.playTone(523.25, 0.1); // C5
                setTimeout(() => this.playTone(659.25, 0.1), 100); // E5
                setTimeout(() => this.playTone(783.99, 0.2), 200); // G5
            },
            error() {
                this.playTone(220, 0.15, 'sawtooth');
                setTimeout(() => this.playTone(180, 0.2, 'sawtooth'), 120);
            },
            levelUp() {
                [440, 554.37, 659.25, 880].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 0.15, 'triangle'), i * 100);
                });
            }
        };

        function saveUserState() {
            if (APP_STATE.user.id) {
                localStorage.setItem(`math_app_user_${APP_STATE.user.id}`, JSON.stringify(APP_STATE.user));
                localStorage.setItem('math_app_last_user_id', APP_STATE.user.id);
            }
        }

        function loadUserState(userId) {
            const data = localStorage.getItem(`math_app_user_${userId}`);
            if (data) {
                try {
                    APP_STATE.user = JSON.parse(data);
                    return true;
                } catch(e) {}
            }
            return false;
        }

        function addXP(amount, message = '') {
            APP_STATE.user.totalXP += amount;
            
            // Check Level Up (Every 100 XP)
            const newLevel = Math.floor(APP_STATE.user.totalXP / 100) + 1;
            if (newLevel > APP_STATE.user.level) {
                APP_STATE.user.level = newLevel;
                const titles = ['Math Explorer', 'Equation Detective', 'Problem Solver', 'Math Strategist', 'Math Master'];
                APP_STATE.user.levelTitle = titles[Math.min(newLevel - 1, titles.length - 1)];
                AudioFX.levelUp();
                showModal('🎉 LEVEL UP!', `<div class="text-center py-4">
                    <div class="text-5xl text-gold mb-2"><i class="fa-solid fa-crown"></i></div>
                    <p class="text-lg font-bold text-slate-100">Selamat! Kamu naik ke Level ${newLevel}</p>
                    <p class="text-brand-400 font-semibold">${APP_STATE.user.levelTitle}</p>
                </div>`);
            } else {
                AudioFX.success();
            }

            updateHeaderUI();
            saveUserState();

            if (message) {
                showToast(`+${amount} XP: ${message}`);
            }
        }

        function awardBadge(badgeKey) {
            if (!APP_STATE.user.badges.includes(badgeKey)) {
                APP_STATE.user.badges.push(badgeKey);
                const b = BADGES_CATALOG[badgeKey];
                saveUserState();
                updateSidebarBadges();
                showModal('🏆 BADGE BARU DIPEROLEH!', `<div class="text-center py-4">
                    <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-tr ${b.color} flex items-center justify-center text-3xl text-white shadow-xl mb-3">
                        <i class="fa-solid ${b.icon}"></i>
                    </div>
                    <p class="text-xl font-bold text-slate-100">${b.name}</p>
                    <p class="text-xs text-slate-400 mt-1">Berhasil ditambahkan ke koleksi lencana kamu!</p>
                </div>`);
            }
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-20 right-6 z-50 bg-brand-600 text-white font-semibold text-sm px-4 py-2.5 rounded-xl shadow-xl flex items-center space-x-2 animate-bounce';
            toast.innerHTML = `<i class="fa-solid fa-circle-check"></i><span>${msg}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showModal(title, contentHtml, onConfirm = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = contentHtml;
            const modal = document.getElementById('app-modal');
            const confirmBtn = document.getElementById('modal-action-btn');

            confirmBtn.onclick = () => {
                modal.classList.add('hidden');
                if (onConfirm) onConfirm();
            };

            document.getElementById('modal-close-btn').onclick = () => {
                modal.classList.add('hidden');
            };

            modal.classList.remove('hidden');
        }

        function updateHeaderUI() {
            document.getElementById('user-xp-display').innerText = `${APP_STATE.user.totalXP} XP`;
            document.getElementById('user-level-display').innerText = `Lvl ${APP_STATE.user.level} - ${APP_STATE.user.levelTitle}`;
            document.getElementById('user-name-display').innerText = APP_STATE.user.name || 'Siswa';
            document.getElementById('user-class-display').innerText = `Kelas ${APP_STATE.user.class}` || 'SMA';
            document.getElementById('user-avatar-initial').innerText = (APP_STATE.user.name || 'S').charAt(0).toUpperCase();

            // Progress bar
            const completedCount = Object.values(APP_STATE.user.completedZones).filter(Boolean).length;
            const totalZones = Object.keys(APP_STATE.user.completedZones).length;
            const percent = Math.round((completedCount / totalZones) * 100);

            document.getElementById('sidebar-progress-percent').innerText = `${percent}%`;
            document.getElementById('sidebar-progress-bar').style.width = `${percent}%`;
        }

        function updateSidebarBadges() {
            const container = document.getElementById('sidebar-badges-container');
            if (APP_STATE.user.badges.length === 0) {
                container.innerHTML = `<span class="text-xs text-slate-500 italic">Belum ada badge</span>`;
                return;
            }
            container.innerHTML = APP_STATE.user.badges.map(key => {
                const b = BADGES_CATALOG[key];
                if (!b) return '';
                return `<div title="${b.name}" class="w-8 h-8 rounded-lg bg-gradient-to-tr ${b.color} flex items-center justify-center text-xs text-white shadow">
                    <i class="fa-solid ${b.icon}"></i>
                </div>`;
            }).join('');
        }

        function renderNavigation() {
            const desktopNav = document.getElementById('desktop-nav-links');
            const mobileNav = document.getElementById('mobile-nav');

            desktopNav.innerHTML = '';
            mobileNav.innerHTML = '';

            ZONES.forEach(zone => {
                const isActive = APP_STATE.currentZone === zone.id;
                const isCompleted = APP_STATE.user.completedZones[zone.id];

                // Desktop link
                const dLink = document.createElement('button');
                dLink.className = `w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-medium text-xs transition ${
                    isActive ? 'bg-brand-600 text-white font-bold shadow-lg shadow-brand-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                }`;
                dLink.onclick = () => navigateToZone(zone.id);
                dLink.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid ${zone.icon} ${isActive ? 'text-white' : zone.color}"></i>
                        <span>${zone.name}</span>
                    </div>
                    ${isCompleted ? '<i class="fa-solid fa-circle-check text-emeraldCustom text-xs"></i>' : ''}
                `;
                desktopNav.appendChild(dLink);

                // Mobile link (select primary 5 for bottom bar)
                if (['dashboard', 'telaah', 'eksplorasi', 'aplikasikan', 'report'].includes(zone.id)) {
                    const mBtn = document.createElement('button');
                    mBtn.className = `flex flex-col items-center py-1 px-2 rounded-lg text-[10px] ${
                        isActive ? 'text-brand-400 font-bold' : 'text-slate-400'
                    }`;
                    mBtn.onclick = () => navigateToZone(zone.id);
                    mBtn.innerHTML = `
                        <i class="fa-solid ${zone.icon} text-base mb-0.5"></i>
                        <span>${zone.name.split(' ')[0]}</span>
                    `;
                    mobileNav.appendChild(mBtn);
                }
            });
        }

        function navigateToZone(zoneId) {
            APP_STATE.currentZone = zoneId;
            renderNavigation();

            const container = document.getElementById('main-screen-container');
            container.scrollTop = 0;

            switch(zoneId) {
                case 'welcome':
                    renderWelcomeScreen();
                    break;
                case 'dashboard':
                    renderDashboardScreen();
                    break;
                case 'telaah':
                    renderTelaahScreen();
                    break;
                case 'eksplorasi':
                    renderEksplorasiScreen();
                    break;
                case 'rumuskan':
                    renderRumuskanScreen();
                    break;
                case 'presentasikan':
                    renderPresentasikanScreen();
                    break;
                case 'aplikasikan':
                    renderAplikasikanScreen();
                    break;
                case 'duniawi':
                    renderDuniawiScreen();
                    break;
                case 'ukhrowi':
                    renderUkhrowiScreen();
                    break;
                case 'finalMission':
                    renderFinalMissionScreen();
                    break;
                case 'report':
                    renderReportScreen();
                    break;
                default:
                    renderDashboardScreen();
            }
        }

        function renderWelcomeScreen() {
            document.getElementById('main-header').classList.add('hidden');
            document.getElementById('mobile-nav').classList.add('hidden');

            const container = document.getElementById('main-screen-container');
            container.innerHTML = `
            <div class="min-h-full flex items-center justify-center p-4">
                <div class="max-w-md w-full glass-panel p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6 text-center">
                    <div class="w-20 h-20 mx-auto rounded-2xl bg-gradient-to-tr from-brand-600 to-cyan-400 flex items-center justify-center text-4xl text-white shadow-xl glow-active">
                        <i class="fa-solid fa-square-root-variable"></i>
                    </div>

                    <div>
                        <h2 class="text-2xl font-extrabold text-white tracking-tight">Selamat Datang di</h2>
                        <h1 class="text-3xl font-black bg-gradient-to-r from-brand-400 to-cyan-300 bg-clip-text text-transparent">Math Adventure</h1>
                        <p class="text-xs text-slate-400 mt-2">Sistem Persamaan Linear (SPLDV) — JSIT TERPADU</p>
                    </div>

                    <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 text-left space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Nama Lengkap</label>
                            <input type="text" id="input-student-name" placeholder="Masukkan nama kamu..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500 transition">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Pilih Kelas</label>
                            <select id="input-student-class" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500 transition">
                                <option value="X-A">Kelas X-A</option>
                                <option value="X-B">Kelas X-B</option>
                                <option value="XI-A">Kelas XI-A</option>
                                <option value="XI-B">Kelas XI-B</option>
                                <option value="XII-A">Kelas XII-A</option>
                                <option value="XII-B">Kelas XII-B</option>
                            </select>
                        </div>
                    </div>

                    <button id="btn-start-adventure" class="w-full py-4 rounded-xl bg-gradient-to-r from-brand-600 to-cyan-500 hover:from-brand-500 hover:to-cyan-400 font-bold text-white text-base shadow-lg shadow-brand-500/25 transition transform active:scale-95 flex items-center justify-center space-x-2">
                        <span>MULAI PETUALANGAN</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>

                    <p class="text-[11px] text-slate-500 italic">"Temukan. Pahami. Jelaskan. Terapkan."</p>
                </div>
            </div>`;

            document.getElementById('btn-start-adventure').onclick = () => {
                const name = document.getElementById('input-student-name').value.trim();
                const studentClass = document.getElementById('input-student-class').value;

                if (!name) {
                    showModal('Peringatan', 'Silakan masukkan nama kamu terlebih dahulu untuk memulai!');
                    return;
                }

                // Generate Unique Student ID (Combination of Name + Class + Timestamp Hash)
                const uniqueId = `${name.toLowerCase().replace(/\s+/g, '_')}_${studentClass}_${Date.now().toString(36)}`;
                
                // Initialize User State
                APP_STATE.user.id = uniqueId;
                APP_STATE.user.name = name;
                APP_STATE.user.class = studentClass;

                saveUserState();

        function initEksplorasiCanvas() {
            const canvas = document.getElementById('spldv-canvas');
            if (!canvas) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
        }

        function drawEksplorasiGraph() {
            const canvas = document.getElementById('spldv-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            // Grid scale: 0 to 20 (in thousands)
            const padding = 40;
            const graphW = w - padding * 2;
            const graphH = h - padding * 2;

            function toCanvasX(val) {
                return padding + (val / 20) * graphW;
            }
            function toCanvasY(val) {
                return h - padding - (val / 20) * graphH;
            }

            // Draw Axes
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            // X Axis
            ctx.moveTo(padding, h - padding);
            ctx.lineTo(w - padding, h - padding);
            // Y Axis
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, h - padding);
            ctx.stroke();

            // Grid lines
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 20; i += 2) {
                // Vertical
                ctx.beginPath();
                ctx.moveTo(toCanvasX(i), padding);
                ctx.lineTo(toCanvasX(i), h - padding);
                ctx.stroke();

                // Horizontal
                ctx.beginPath();
                ctx.moveTo(padding, toCanvasY(i));
                ctx.lineTo(w - padding, toCanvasY(i));
                ctx.stroke();
            }

            // Line 1: 2x + y = 14  => y = 14 - 2x
            ctx.strokeStyle = '#38bdf8'; // brand blue
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(toCanvasX(0), toCanvasY(14));
            ctx.lineTo(toCanvasX(7), toCanvasY(0));
            ctx.stroke();

            // Line 2: x + 2y = 16  => y = 8 - 0.5x
            ctx.strokeStyle = '#22d3ee'; // cyan
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(toCanvasX(0), toCanvasY(8));
            ctx.lineTo(toCanvasX(16), toCanvasY(0));
            ctx.stroke();

            // Solution Point Intersection (4, 6)
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(toCanvasX(4), toCanvasY(6), 8, 0, Math.PI * 2);
            ctx.fill();

            // Current Slider Point
            const currX = eksplorasiX / 1000;
            const currY = eksplorasiY / 1000;
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(toCanvasX(currX), toCanvasY(currY), 6, 0, Math.PI * 2);
            ctx.fill();
        }

                APP_STATE.user.completedZones.duniawi = true;
                APP_STATE.user.scores.application += 50;
                addXP(50, 'Menyelesaikan Zona Duniawi');
                awardBadge('duniawi_solver');

            navigateToZone('ukhrowi');
        }

            const x = parseInt(document.getElementById('fm-ans-x').value);
            const y = parseInt(document.getElementById('fm-ans-y').value);

            if (x === 8000 && y === 6000) {
                AudioFX.levelUp();
                if (!APP_STATE.user.completedZones.finalMission) {
                    APP_STATE.user.completedZones.finalMission = true;
                    addXP(100, 'Menyelesaikan Final Mission!');
                    awardBadge('math_explorer');
                }
                showModal('🏆 MISI SELESAI!', 'Selamat! Kamu telah berhasil menyelesaikan seluruh petualangan Sistem Persamaan Linear!', () => {

                AudioFX.error();
                showModal('Belum Tepat', 'Coba periksa kembali eliminasi persamaan 2x + y = 22.000 dan x + 2y = 20.000');
